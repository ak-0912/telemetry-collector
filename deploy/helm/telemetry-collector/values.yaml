fullnameOverride: telemetry-collector

replicaCount: 2

image:
  repository: telemetry-collector
  tag: latest
  pullPolicy: IfNotPresent

env:
  workerCount: "8"
  queueBatchSize: "50"
  pollInterval: "2s"
  postgresDsn: "postgres://telemetry:telemetry@telemetry-db-postgres:5432/telemetry?sslmode=disable"
  # mock | http | grpc — must match collector config (see internal/infrastructure/config).
  queueBackend: grpc
  # host:port only (no grpc://); Kubernetes Service DNS for your MQ pod.
  mqGrpcAddr: telemetry-message-queue.telemetry.svc.cluster.local:50051
  mqTopic: gpu-telemetry
  mqGroup: telemetry-collector
  mqHeartbeatInterval: 3s

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

hpa:
  minReplicas: 2
  maxReplicas: 10
  averageCPUUtilization: 70
